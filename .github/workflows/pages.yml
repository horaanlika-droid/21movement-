name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The site is served one of two ways, depending on Settings → Pages:
      #   Source "GitHub Actions"  → this workflow deploys docs/.
      #   Source "Deploy from a branch" → GitHub already serves the branch
      #     (root index.html redirects to docs/), and this workflow must not
      #     fight it. So we ask the Pages API which mode is on.
      - name: Which Pages mode is on?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          if [ "$bt" = "legacy" ]; then
            echo "::warning title=Pages uses branch deploys::The site is already live from the branch (root index.html redirects to docs/). To deploy from this workflow instead: Settings → Pages → Build and deployment → Source: GitHub Actions."
          elif [ "$bt" = "none" ]; then
            echo "::warning title=Pages is off::Settings → Pages → Build and deployment → Source: GitHub Actions (or Deploy from a branch, main, /(root)), then re-run this workflow. Nothing is wrong with docs/."
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.mode.outputs.build_type == 'workflow'
        path: docs

      - id: deployment
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v5
